version: '3.8'

services:
  mythara-api:
    build:
      context: ../..
      dockerfile: core/Dockerfile
    container_name: mythara-engine-api
    ports:
      - "8000:8000"
    environment:
      - API_VERSION=1.0.0
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/app/core/source_proprietary
    command: python core/source_proprietary/main.py
    restart: unless-stopped
    networks:
      - mythara-network

  # Optional: Add Redis for production state management
  # redis:
  #   image: redis:7-alpine
  #   container_name: mythara-redis
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - mythara-network
  #   restart: unless-stopped

  # Optional: Add PostgreSQL for clause storage
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: mythara-postgres
  #   environment:
  #     POSTGRES_DB: mythara
  #     POSTGRES_USER: mythara_user
  #     POSTGRES_PASSWORD: changeme_in_production
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - mythara-network
  #   restart: unless-stopped

networks:
  mythara-network:
    driver: bridge

